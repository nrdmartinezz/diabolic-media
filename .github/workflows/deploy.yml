name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy to Firebase
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm ci --prefix functions

      # A type error or malformed frontmatter must never reach production.
      - run: npm run verify

      - run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/18956235516/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@diabolic-media.iam.gserviceaccount.com

      - name: Deploy Hosting and Functions
        run: npx -y firebase-tools@latest deploy --project diabolic-media --only functions,hosting --non-interactive --force
